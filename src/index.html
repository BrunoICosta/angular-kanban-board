<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fluxo · Kanban</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Quadro Kanban com Angular, NgRx e CDK Drag and Drop." />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the persisted theme before the first paint to avoid a flash of the wrong theme.
      (function () {
        // Dark is the default theme; the toggle in the header persists the choice.
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('kanban.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
