<header class="header">
  <a class="brand" routerLink="/boards" aria-label="Fluxo — ir para meus quadros">
    <span class="brand__logo" aria-hidden="true"> <span></span><span></span><span></span> </span>
    <span class="brand__name">Fluxo</span>
  </a>

  <div class="header__actions">
    <button
      type="button"
      class="icon-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="
        themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'
      "
    >
      <app-icon [name]="themeService.theme() === 'dark' ? 'sun' : 'moon'" />
    </button>
  </div>
</header>
