<header class="header">
  <a class="brand" routerLink="/boards" [attr.aria-label]="'header.home' | transloco">
    <span class="brand__logo" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="brand__name">Fluxo</span>
  </a>

  <div class="header__actions">
    <app-language-switcher />

    <button
      type="button"
      class="icon-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="
        (themeService.theme() === 'dark' ? 'header.themeToLight' : 'header.themeToDark') | transloco
      "
    >
      <app-icon [name]="themeService.theme() === 'dark' ? 'sun' : 'moon'" />
    </button>

    @if (demo.simulateFailures()) {
      <span class="failure-badge" role="status">
        <app-icon name="zap" [size]="14" />
        {{ 'header.failuresBadge' | transloco }}
      </span>
    }

    @if (user(); as user) {
      <button
        type="button"
        class="user-btn"
        [cdkMenuTriggerFor]="userMenu"
        [attr.aria-label]="'header.userMenu' | transloco: { name: user.name }"
      >
        <app-avatar [name]="user.name" [size]="32" />
      </button>

      <ng-template #userMenu>
        <div class="menu" cdkMenu>
          <div class="menu__header">
            <strong>{{ user.name }}</strong>
            <span>{{ user.email }}</span>
          </div>
          <div class="menu__separator" role="separator"></div>
          <span class="menu__caption">{{ 'header.demo' | transloco }}</span>
          <button
            type="button"
            class="menu__item"
            cdkMenuItemCheckbox
            [cdkMenuItemChecked]="demo.simulateFailures()"
            (cdkMenuItemTriggered)="demo.toggleSimulateFailures()"
          >
            <app-icon name="zap" [size]="16" />
            {{ 'header.simulateFailures' | transloco }}
            <span class="menu__check" aria-hidden="true">
              @if (demo.simulateFailures()) {
                <app-icon name="check" [size]="14" />
              }
            </span>
          </button>
          <button
            type="button"
            class="menu__item"
            cdkMenuItem
            (cdkMenuItemTriggered)="restoreSampleData()"
          >
            <app-icon name="refresh" [size]="16" />
            {{ 'header.restoreSample' | transloco }}
          </button>
          <div class="menu__separator" role="separator"></div>
          <button type="button" class="menu__item" cdkMenuItem (cdkMenuItemTriggered)="logout()">
            <app-icon name="logout" [size]="16" />
            {{ 'header.logout' | transloco }}
          </button>
        </div>
      </ng-template>
    }
  </div>
</header>
