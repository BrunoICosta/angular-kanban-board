<section class="column" [attr.aria-labelledby]="'column-title-' + column().id">
  <header class="column__header" cdkDragHandle>
    <app-icon class="column__grip" name="grip" [size]="14" />
    <h2 class="column__title" [id]="'column-title-' + column().id">{{ column().title }}</h2>
    <span class="column__count" [attr.aria-label]="countLabel() + ' cartões'">
      {{ countLabel() }}
    </span>
    <button
      type="button"
      class="icon-btn icon-btn--sm"
      [cdkMenuTriggerFor]="menu"
      [attr.aria-label]="'Ações da coluna ' + column().title"
    >
      <app-icon name="more" [size]="16" />
    </button>
  </header>

  <ul
    class="column__cards"
    role="list"
    cdkDropList
    [id]="listId()"
    [cdkDropListData]="cards()"
    [cdkDropListConnectedTo]="connectedTo()"
    [cdkDropListDisabled]="dragDisabled()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (card of cards(); track card.id) {
      <li class="column__card" cdkDrag [cdkDragData]="card.id" [cdkDragStartDelay]="dragStartDelay">
        <app-card-item [card]="card" (open)="openCard.emit($event)" />
        <div class="card-placeholder" *cdkDragPlaceholder></div>
      </li>
    } @empty {
      <li class="column__empty">
        {{ dragDisabled() ? 'Nenhum cartão corresponde ao filtro' : 'Arraste um cartão para cá' }}
      </li>
    }
  </ul>

  <footer class="column__footer">
    <app-inline-add-form
      triggerLabel="Adicionar cartão"
      [inputLabel]="'Título do novo cartão em ' + column().title"
      placeholder="O que precisa ser feito?"
      (submitted)="addCard.emit({ column: column(), title: $event })"
    />
  </footer>
</section>

<ng-template #menu>
  <div class="menu" cdkMenu>
    <button
      type="button"
      class="menu__item"
      cdkMenuItem
      (cdkMenuItemTriggered)="editColumn.emit(column())"
    >
      <app-icon name="edit" [size]="16" />
      Renomear e limite WIP
    </button>
    @if (canMoveLeft()) {
      <button
        type="button"
        class="menu__item"
        cdkMenuItem
        (cdkMenuItemTriggered)="moveColumn.emit(-1)"
      >
        <app-icon name="arrow-left" [size]="16" />
        Mover para a esquerda
      </button>
    }
    @if (canMoveRight()) {
      <button
        type="button"
        class="menu__item"
        cdkMenuItem
        (cdkMenuItemTriggered)="moveColumn.emit(1)"
      >
        <app-icon class="flip" name="arrow-left" [size]="16" />
        Mover para a direita
      </button>
    }
    <button
      type="button"
      class="menu__item menu__item--danger"
      cdkMenuItem
      (cdkMenuItemTriggered)="deleteColumn.emit(column())"
    >
      <app-icon name="trash" [size]="16" />
      Excluir coluna
    </button>
  </div>
</ng-template>
