<div class="toolbar" role="search" [attr.aria-label]="'boards.toolbar.label' | transloco">
  <div class="search">
    <app-icon class="search__icon" name="search" [size]="16" />
    <label class="sr-only" for="board-search">{{ 'boards.toolbar.search' | transloco }}</label>
    <input
      id="board-search"
      class="input search__input"
      type="search"
      [placeholder]="'boards.toolbar.searchPlaceholder' | transloco"
      autocomplete="off"
      [formControl]="search"
    />
  </div>

  <div class="labels" role="group" [attr.aria-label]="'boards.toolbar.labels' | transloco">
    @for (label of labels; track label.id) {
      <button
        type="button"
        class="chip"
        [style.--label-color]="label.color"
        [class.chip--active]="filter().labels.includes(label.id)"
        [attr.aria-pressed]="filter().labels.includes(label.id)"
        (click)="labelToggled.emit(label.id)"
      >
        {{ 'boards.labels.' + label.id | transloco }}
      </button>
    }
  </div>

  @if (active()) {
    <p class="summary" role="status">
      {{ 'boards.toolbar.summary' | transloco: summary() }}
      <button type="button" class="btn btn--ghost btn--sm" (click)="clear()">
        <app-icon name="x" [size]="14" />
        {{ 'boards.toolbar.clear' | transloco }}
      </button>
    </p>
  }
</div>
